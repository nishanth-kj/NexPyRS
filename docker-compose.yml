services:
  # --- Reverse Proxy (Traffic Management) ---
  traefik:
    image: traefik:v3.0
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nexnet

  # --- Database (PostgreSQL) ---
  db:
    build: ./database
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexpyrs}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - nexpyrs-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nexpyrs}
    networks:
      - nexnet

  # --- PgAdmin (Database Management) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@nexpyrs.dev}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      - db
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.localhost`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ./ui_web
      dockerfile: Dockerfile
    restart: always
    # ports:  # Uncomment for direct access (bypassing Traefik)
    #   - "3000:3000"
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  # --- FastAPI Backend ---
  api:
    build:
      context: .
      dockerfile: api_fastapi/Dockerfile
    restart: always
    # ports:  # Uncomment for direct access (bypassing Traefik)
    #   - "8000:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-NexPyRS}
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-nexpyrs}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexnet
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # --- Django Application ---
  django:
    build:
      context: .
      dockerfile: api_django/Dockerfile
    restart: always
    # ports:  # Uncomment for direct access (bypassing Traefik)
    #   - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-nexpyrs}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`django.localhost`)"
      - "traefik.http.routers.django.entrypoints=web"
      - "traefik.http.services.django.loadbalancer.server.port=8000"

  # --- gRPC Service ---
  grpcsvc:
    build: ./grpcsvc
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grpcsvc.rule=Host(`grpc.localhost`)"
      - "traef ik.http.routers.grpcsvc.entrypoints=web"
      - "traefik.http.services.grpcsvc.loadbalancer.server.port=50051"

  # --- Rust Microservice ---
  rustsvc:
    build: ./rustsvc
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db/${POSTGRES_DB:-nexpyrs}
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rustsvc.rule=Host(`rust.localhost`)"
      - "traefik.http.routers.rustsvc.entrypoints=web"
      - "traefik.http.services.rustsvc.loadbalancer.server.port=8080"

  # --- Jenkins CI/CD ---
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    restart: always
    user: root
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.localhost`)"
      - "traefik.http.routers.jenkins.entrypoints=web"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
  # --- Spring Boot API ---
  api_spring:
    build:
      context: .
      dockerfile: api_spring/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spring.rule=Host(`spring.localhost`)"
      - "traefik.http.routers.spring.entrypoints=web"
      - "traefik.http.services.spring.loadbalancer.server.port=8080"
  # --- Drogon C++ API ---
  api_dragon:
    build:
      context: .
      dockerfile: api_dragon/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dragon.rule=Host(`drogon.localhost`)"
      - "traefik.http.routers.dragon.entrypoints=web"
      - "traefik.http.services.dragon.loadbalancer.server.port=8080"

  # --- Actix Rust API ---
  api_actix:
    build:
      context: .
      dockerfile: api_actix/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actix.rule=Host(`actix.localhost`)"
      - "traefik.http.routers.actix.entrypoints=web"
      - "traefik.http.services.actix.loadbalancer.server.port=8080"
  # --- Redis ---
  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    restart: always
    ports:
      - "6379:6379"
    networks:
      - nexnet

  # --- RabbitMQ ---
  rabbitmq:
    build:
      context: .
      dockerfile: rabbitmq/Dockerfile
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - nexnet

  # --- Websocket Service ---
  websocket:
    build:
      context: .
      dockerfile: websocket/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.websocket.rule=Host(`ws.localhost`)"
      - "traefik.http.services.websocket.loadbalancer.server.port=8080"

  # --- Website (React) ---
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`website.localhost`)"
      - "traefik.http.services.website.loadbalancer.server.port=5173"
  # --- Next.js ---
  next:
    build:
      context: .
      dockerfile: ui_next/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.next.rule=Host(`next.localhost`)"
      - "traefik.http.services.next.loadbalancer.server.port=3000"

  # --- Angular ---
  angular:
    build:
      context: .
      dockerfile: ui_angular/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.angular.rule=Host(`angular.localhost`)"
      - "traefik.http.services.angular.loadbalancer.server.port=4200"

  # --- Vite ---
  vite:
    build:
      context: .
      dockerfile: ui_vite/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vite.rule=Host(`vite.localhost`)"
      - "traefik.http.services.vite.loadbalancer.server.port=5173"

  # --- Static Site ---
  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site.rule=Host(`site.localhost`)"
      - "traefik.http.services.site.loadbalancer.server.port=80"
  # --- Apache Kafka ---
  kafka:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    restart: always
    ports:
      - "9092:9092"
    networks:
      - nexnet
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  # --- Kafka UI ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: always
    networks:
      - nexnet
    environment:
      - KAFKA_CLUSTERS_0_NAME=NexPyRS_Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka.rule=Host(`kafka.localhost`)"
      - "traefik.http.services.kafka.loadbalancer.server.port=8080"
  # --- Web3: Solidity / Ethereum (Hardhat) ---
  hardhat-node:
    build:
      context: .
      dockerfile: solidity/Dockerfile
    restart: always
    ports:
      - "8545:8545"
    networks:
      - nexnet

  # --- Web3: Solana (Test Validator) ---
  solana-validator:
    build:
      context: .
      dockerfile: solana/Dockerfile
    restart: always
    ports:
      - "8899:8899"
      - "8900:8900"
    networks:
      - nexnet
  # --- MCP Server ---
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: always
    networks:
      - nexnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=Host(`mcp.localhost`)"
      - "traefik.http.services.mcp.loadbalancer.server.port=3001"
  # --- MongoDB ---
  mongodb:
    build:
      context: .
      dockerfile: mongodb/Dockerfile
    restart: always
    ports:
      - "27017:27017"
    networks:
      - nexnet
    volumes:
      - nexpyrs-mongo-data:/data/db

volumes:
  nexpyrs-mongo-data:
  nexpyrs-db-data:
  jenkins-data:


networks:
  nexnet:
    driver: bridge

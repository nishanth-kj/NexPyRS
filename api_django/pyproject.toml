[project]
name = "api-django"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "nishanth-kj", email = "nishanthkj12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1",
    "gunicorn>=26.1.0",
    "psycopg2-binary>=2.9.12",
    "redis>=8.1.0",
]

[project.scripts]
api-django = "api_django:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["."]
extraPaths = ["."]

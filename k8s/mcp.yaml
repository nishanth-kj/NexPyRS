apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
      - name: mcp
        image: nexpyrs-mcp
        ports:
        - containerPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  ports:
  - port: 3001
